name: Reproduce paper results

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install packages
        run: pip install numpy==2.0.2 pandas==2.3.3 matplotlib==3.9.4

      - name: Rebuild tables and figures from the stored results
        run: python scripts/reproduce_paper.py

      - name: Check every number of the paper
        run: |
          python - <<'EOF'
          import sys
          import pandas as pd
          d = pd.read_csv("results/paper/paper_numbers.csv")
          bad = d[d.status != "match"]
          print(f"{len(d)} paper numbers, {len(bad)} not matching")
          if len(bad):
              print(bad.to_string())
              sys.exit(1)
          EOF
